<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ALAS-SAIS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect width=%2716%27 height=%2716%27 fill=%27%23000%27/%3E%3Ccircle cx=%278%27 cy=%278%27 r=%275%27 fill=%27none%27 stroke=%27%23b3261e%27 stroke-width=%272%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&family=Special+Elite&family=Inter:wght@400;600&display=swap">
<style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{font-family:Inter,system-ui,sans-serif;color:#e9dfcb}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;overflow:hidden;background:#000}
.layer{position:absolute;inset:0}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .3s ease,filter .4s ease,transform .6s ease;pointer-events:none}
.bg.now{transition:none}
#dark{pointer-events:none;opacity:0;transition:opacity .3s}
#grain{pointer-events:none;opacity:0;mix-blend-mode:overlay}
#vig{pointer-events:none;background:radial-gradient(ellipse at 50% 50%,transparent 45%,rgba(0,0,0,.75) 100%)}
#flash{pointer-events:none;opacity:0;background:#b3261e;z-index:9}
#fog{pointer-events:none;opacity:0;transition:opacity 1s;background:radial-gradient(ellipse at 50% 40%,rgba(200,210,220,.32),rgba(200,210,220,.05) 60%,transparent 75%)}
#fog .hand{position:absolute;width:110px;height:140px;border-radius:40% 40% 30% 30%;background:radial-gradient(rgba(10,10,12,.55),transparent 70%)}
#scare{display:none;position:absolute;inset:0;background:#000;overflow:hidden;z-index:10}
#scare img{position:absolute;inset:-6%;width:112%;height:112%;object-fit:cover}
#scare.go img{animation:scare 1.5s cubic-bezier(.2,1.6,.4,1) forwards}
#scare.go.soft img{animation:scaresoft 1.5s ease-out forwards}
@keyframes scare{0%{transform:scale(1.7) translate(0,4%);filter:brightness(2) contrast(1.6)}8%{transform:scale(1.15) translate(-2%,1%)}12%{transform:scale(1.25) translate(2%,-1%);filter:brightness(1.3) contrast(1.4) hue-rotate(-12deg)}18%{transform:scale(1.12) translate(-1%,2%)}25%{transform:scale(1.2) translate(1%,-2%)}40%{transform:scale(1.08)}100%{transform:scale(1.04);filter:brightness(.6)}}
@keyframes scaresoft{0%{transform:scale(1.25);filter:brightness(.6)}100%{transform:scale(1.05);filter:brightness(.5)}}
#scare.go::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.35) 0 2px,transparent 2px 4px);animation:tear .12s steps(2) 10}
@keyframes tear{0%{transform:translateY(0)}100%{transform:translateY(6px)}}
.shake{animation:shake .4s linear}
@keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-4px)}60%{transform:translate(-4px,-2px)}80%{transform:translate(4px,4px)}}
/* HUD */
#hud{pointer-events:none;z-index:4}
#hud .pe{pointer-events:auto}
#clock{position:absolute;left:24px;top:20px;padding:10px 16px;background:rgba(8,8,8,.72);border:1px solid #2a2620;border-radius:14px}
#clock b{display:block;font-family:Oswald,sans-serif;font-weight:500;font-size:34px;letter-spacing:2px;line-height:1}
#clock span{font-size:13px;letter-spacing:2px;color:#a39886}
#topr{position:absolute;right:20px;top:20px;display:flex;gap:10px;align-items:center}
.chip{padding:8px 12px;background:rgba(8,8,8,.72);border:1px solid #2a2620;border-radius:12px;font-size:14px;color:#c9bfab;display:flex;align-items:center;gap:8px}
.bar{width:90px;height:10px;border:1px solid #6b6253;padding:1px}.bar i{display:block;height:100%;background:#e0a24a}
#pauseBtn{width:56px;height:56px;border-radius:14px;background:rgba(8,8,8,.72);border:1px solid #2a2620;color:#e9dfcb;font:700 20px Oswald,sans-serif}
#cap{position:absolute;left:50%;transform:translateX(-50%);bottom:150px;max-width:900px;padding:8px 16px;background:rgba(0,0,0,.66);font-family:'Special Elite',monospace;font-size:21px;color:#e6dccb;text-align:center;opacity:0;transition:opacity .4s;pointer-events:none}
#msg{position:absolute;left:50%;top:18px;transform:translateX(-50%) translateY(-140%);width:560px;padding:14px 18px;background:rgba(18,18,20,.94);border:1px solid #3a352d;border-radius:18px;transition:transform .45s cubic-bezier(.2,1.2,.4,1);box-shadow:0 12px 40px #000;pointer-events:none}
#msg.show{transform:translateX(-50%) translateY(0)}
#msg small{display:block;color:#a39886;font-size:13px;letter-spacing:1px;margin-bottom:4px}
#msg p{margin:0;font-size:18px;line-height:1.4}
.btn{min-height:56px;padding:0 14px;border-radius:14px;border:1px solid #3a352d;background:rgba(10,10,10,.8);color:#e9dfcb;font:600 16px Inter,sans-serif;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.15;cursor:pointer;touch-action:none}
.btn:active,.btn.down{background:#3a1a14;border-color:#b3261e}
.btn.cur{border-color:#e0a24a;color:#e0a24a}
.btn.off{opacity:.35}
.btn.hold{background:rgba(70,14,10,.85);border-color:#b3261e;font-family:Oswald,sans-serif;font-weight:500;letter-spacing:2px;font-size:20px}
.btn.hold.down{background:#b3261e;color:#fff}
#breathMeter{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:120px;height:120px;border-radius:50%;opacity:0;transition:opacity .2s;pointer-events:none}
/* screens */
.scr{position:absolute;inset:0;display:none;background:#07080a;z-index:20}
.scr.show{display:block}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:40px}
h1.logo{margin:0;font-family:Oswald,sans-serif;font-weight:700;font-size:96px;letter-spacing:12px;line-height:1;color:#e9dfcb}
.sub{font-family:'Special Elite',monospace;color:#a39886;font-size:20px;margin:0}
.menu{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.mi{background:none;border:0;color:#a39886;font:500 28px Oswald,sans-serif;letter-spacing:4px;text-transform:uppercase;padding:6px 0;min-height:52px;cursor:pointer;text-align:left;display:flex;gap:14px;align-items:baseline}
.mi:hover,.mi:active{color:#e9dfcb}.mi[disabled]{opacity:.3}
.mi small{font:400 13px Inter,sans-serif;letter-spacing:1px;color:#8a8070}
.panel{position:absolute;inset:40px 60px;background:#0c0c0b;border:1px solid #2a2620;padding:30px 40px;display:flex;flex-direction:column;gap:20px;overflow:auto}
.panel h2{margin:0;font:700 36px Oswald,sans-serif;letter-spacing:6px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:36px}
.field{display:flex;flex-direction:column;gap:8px;font-size:15px;color:#c9bfab}
.seg{display:flex;gap:6px}.seg .btn{flex:1;min-height:48px}
input[type=range]{width:100%;accent-color:#b3261e;height:30px}
.tog{display:flex;align-items:center;justify-content:space-between;gap:10px}
.lang{position:absolute;right:36px;top:30px;display:flex;gap:8px}
.lang .btn{min-height:46px}
.note{font-size:13px;color:#8a8070}
#loadBar{width:360px;height:6px;background:#1c1a17}#loadBar i{display:block;height:100%;width:0;background:#b3261e;transition:width .2s}
.over{background:radial-gradient(ellipse at 70% 40%,#2a0a07,#050303)}
.over .center{align-items:flex-start;padding-left:90px}
.over h1{margin:0;font:700 72px Oswald,sans-serif;letter-spacing:4px}
.hintbox{max-width:560px;padding:16px 18px;border:1px solid #3a1d16;background:rgba(14,6,5,.8);font-size:17px;line-height:1.5;text-align:left}
.row2{display:flex;gap:14px}
.cta{min-height:56px;padding:0 28px;font:500 20px Oswald,sans-serif;letter-spacing:4px;border:1px solid #6b2a20;background:none;color:#e9dfcb;border-radius:4px;cursor:pointer}
.cta.red{background:#b3261e;border-color:#b3261e;color:#fff}
.rule{display:flex;gap:16px;align-items:center;max-width:820px;text-align:left;padding:14px 16px;background:rgba(20,18,16,.8);border:1px solid #2a2620}
.rule img{width:180px;height:101px;object-fit:cover}
.rule b{font-family:Oswald,sans-serif;letter-spacing:2px;font-size:20px;color:#e0a24a}
#rotate{display:none;position:fixed;inset:0;z-index:99;background:#07080a;color:#e9dfcb;align-items:center;justify-content:center;flex-direction:column;gap:20px;text-align:center;font-family:Oswald,sans-serif;font-size:24px;letter-spacing:2px}
#rotate .ph{width:60px;height:100px;border:4px solid #e9dfcb;border-radius:12px;animation:rot 2s ease-in-out infinite}
@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (prefers-reduced-motion:reduce){.bg{transition:none}}

/* camera rig + in-scene pieces */
#cam{transform-origin:50% 50%;will-change:transform}
#black{background:#000;opacity:0;pointer-events:none}
#fx{pointer-events:none;perspective:1100px}
.leaf{position:absolute;background-repeat:no-repeat;background-size:1280px 720px;transform-origin:0 50%;box-shadow:0 0 30px rgba(0,0,0,.6)}
.half{position:absolute;top:0;height:100%;width:50%;background-repeat:no-repeat;background-size:1280px 720px}
.crt{position:absolute;background:#f4f7ff;box-shadow:0 0 40px #cfe0ff}
.grainS{position:absolute;width:6px;height:6px;border-radius:50%;background:#f2efe6;box-shadow:0 0 6px #fff}
/* hotspots */
#hot{z-index:3}
#hotbg{position:absolute;inset:0;touch-action:none}
.spot{position:absolute;touch-action:none;cursor:pointer}
.spot .dot{position:absolute;left:50%;top:50%;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:2px solid rgba(233,223,203,.7);box-shadow:0 0 14px rgba(233,223,203,.35);animation:pulse 2.2s ease-in-out infinite}
.spot .dot::after{content:"";position:absolute;inset:8px;border-radius:50%;background:rgba(233,223,203,.85)}
.spot .lbl{position:absolute;left:50%;top:50%;transform:translate(-50%,24px);white-space:nowrap;padding:5px 11px;border-radius:999px;background:rgba(0,0,0,.62);font:600 15px Inter,sans-serif;color:#e9dfcb;letter-spacing:.3px;border:1px solid rgba(233,223,203,.18)}
.spot.hold .dot{border-color:rgba(224,90,60,.9);box-shadow:0 0 18px rgba(179,38,30,.6)}
.spot.hold .dot::after{background:#e0553c}
.spot.hold .lbl{font-family:Oswald,sans-serif;font-weight:500;letter-spacing:2px;border-color:rgba(179,38,30,.6)}
.spot.down .dot{transform:scale(1.6);animation:none;background:rgba(179,38,30,.35)}
.spot.down .lbl{background:#b3261e;color:#fff}
.spot.off{opacity:.4}
.spot.urgent .dot{border-color:#e0a24a;animation-duration:.8s}
.spot.focus .dot{animation:focus .7s ease-in-out infinite;border-color:#ffd27a}
.spot.focus .lbl{background:#e0a24a;color:#111}
.spot.exit .dot{display:none}
.spot.exit{background:linear-gradient(to top,rgba(0,0,0,.6),transparent)}
.spot.exit .lbl{top:auto;bottom:14px;transform:translateX(-50%);font-family:Oswald,sans-serif;letter-spacing:3px;font-size:17px}
.dim .spot .lbl{opacity:.55}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.75}50%{transform:scale(1.18);opacity:1}}
@keyframes focus{0%,100%{transform:scale(1.2);box-shadow:0 0 10px #ffd27a}50%{transform:scale(1.7);box-shadow:0 0 34px #ffd27a}}
#hint{position:absolute;left:50%;bottom:76px;transform:translateX(-50%);padding:7px 14px;border-radius:10px;background:rgba(0,0,0,.6);font-size:16px;color:#d8cdb8;opacity:0;transition:opacity .4s;pointer-events:none;white-space:nowrap}
#runBtn{min-height:56px;font:600 15px Oswald,sans-serif;letter-spacing:3px;cursor:pointer;touch-action:manipulation}
#runBtn.cur{border-color:#e0a24a;color:#e0a24a}
/* phone call */
#phone{position:absolute;left:26px;bottom:24px;width:300px;padding:16px;border-radius:26px;background:linear-gradient(#1b1d1f,#0c0d0e);border:2px solid #34312b;box-shadow:0 20px 50px #000,inset 0 0 0 6px #050505;transform:translateY(130%);transition:transform .5s cubic-bezier(.2,1.2,.4,1);z-index:5}
#phone.show{transform:translateY(0)}
#phone.ring{animation:buzz .3s linear infinite}
@keyframes buzz{0%,100%{margin-left:0}25%{margin-left:-3px}75%{margin-left:3px}}
.ph-top{display:flex;justify-content:space-between;font:500 13px Oswald,sans-serif;letter-spacing:2px;color:#8fd18a;background:#132015;padding:6px 10px;border-radius:8px}
.ph-who{display:flex;align-items:center;gap:12px;margin:14px 2px}
.ph-av{width:46px;height:46px;border-radius:50%;background:#2b241c;display:flex;align-items:center;justify-content:center;font:700 22px Oswald,sans-serif;color:#e0a24a}
.ph-who b{font:500 24px Oswald,sans-serif;letter-spacing:1px}
.ph-btns{display:flex;gap:10px}
.ph-btns button{flex:1;min-height:56px;border-radius:16px;border:0;font:600 17px Inter,sans-serif;color:#fff;cursor:pointer;touch-action:manipulation}
.ph-g{background:#2e7d32}.ph-r{background:#b3261e}
#phone.talk .ph-g{display:none}
#phone.talk{width:240px;padding:12px}
#phone.talk .ph-who{margin:8px 2px}
#sub{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);width:max-content;max-width:680px;padding:12px 20px;background:rgba(0,0,0,.78);border-left:3px solid #e0a24a;font-size:21px;line-height:1.4;color:#efe6d4;opacity:0;transition:opacity .3s;pointer-events:none}
#sub b{display:block;font:500 12px Oswald,sans-serif;letter-spacing:3px;color:#e0a24a;margin-bottom:3px}
#sub.show{opacity:1}

/* menu background: the room you have reached, its light failing */
#mbg{position:absolute;inset:0;overflow:hidden;background:#000}
#mbg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform-origin:50% 55%;animation:mzoom 40s ease-in-out infinite alternate}
#mbg-off{opacity:0}#mbg-lit{opacity:0}
@keyframes mzoom{from{transform:scale(1.02)}to{transform:scale(1.1) translateX(-1.5%)}}
#mbg-fog{position:absolute;inset:-20%;background:radial-gradient(ellipse at 30% 70%,rgba(160,170,190,.07),transparent 50%),radial-gradient(ellipse at 70% 60%,rgba(160,170,190,.05),transparent 45%);animation:fog 26s linear infinite alternate}
@keyframes fog{from{transform:translateX(-6%)}to{transform:translateX(6%)}}
#mbg-shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.82) 0,rgba(0,0,0,.45) 38%,rgba(0,0,0,0) 65%),linear-gradient(0deg,rgba(0,0,0,.6),transparent 35%)}
#scr-menu .logo{font-size:92px;letter-spacing:10px;text-shadow:0 0 30px rgba(179,38,30,.35),0 4px 0 #000}
.chlist{display:flex;gap:18px;align-items:stretch}
.chcard{flex:1;min-width:0;padding:18px;border:1px solid rgba(233,223,203,.18);background:rgba(10,10,12,.7);border-radius:12px;display:flex;flex-direction:column;gap:10px}
.chcard h3{margin:0;font:500 24px Oswald,sans-serif;letter-spacing:2px}
.chcard p{margin:0;font-size:15px;line-height:1.45;color:#bfb5a2}
.chcard.locked{opacity:.45}
.chnights{display:flex;flex-wrap:wrap;gap:8px}
.chnights button{min-width:56px;min-height:48px;border-radius:10px;border:1px solid rgba(233,223,203,.3);background:#14110e;color:#e9dfcb;font:600 17px Oswald,sans-serif;cursor:pointer}
.chnights button:disabled{opacity:.3;cursor:default}
.chnights button.done{border-color:#e0a24a;color:#e0a24a}
.cred{display:flex;flex-direction:column;gap:12px;max-width:820px}
.cred-title{font:500 64px Oswald,sans-serif;letter-spacing:12px}
.cred-by{font:500 30px Oswald,sans-serif;letter-spacing:3px;color:#e0a24a}
.cred-desc{font-size:19px;line-height:1.55;margin:0;color:#e9dfcb}
.cred-attr{font-size:14px;line-height:1.6;margin:8px 0 0;color:#9d9483}
/* prologue phone call */
#scr-phone{background:#000}
#pp-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(6px) brightness(.35);transform:scale(1.08)}
.pp-wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:60px}
.pp-phone{width:300px;height:560px;border-radius:38px;background:linear-gradient(#1d1f21,#0b0c0d);border:2px solid #3a362f;box-shadow:0 30px 80px #000,inset 0 0 0 8px #050505;display:flex;flex-direction:column;padding:26px 20px;transition:transform .5s}
.pp-phone.ring{animation:buzz .28s linear infinite}
.pp-scr{flex:1;display:flex;flex-direction:column;align-items:center;gap:14px;border-radius:20px;background:radial-gradient(ellipse at 50% 30%,#21301f,#0b120b);padding:18px 10px}
.pp-top{align-self:stretch;display:flex;justify-content:space-between;font:500 14px Oswald,sans-serif;letter-spacing:2px;color:#8fd18a}
.pp-av{margin-top:40px;width:110px;height:110px;border-radius:50%;background:#2b241c;display:flex;align-items:center;justify-content:center;font:700 54px Oswald,sans-serif;color:#e0a24a}
.pp-who{font:500 32px Oswald,sans-serif;letter-spacing:1px}
.pp-num{font-size:15px;color:#8d9a88;letter-spacing:2px}
.pp-btns{display:flex;padding-top:18px}
.pp-btns button{flex:1;min-height:64px;border:0;border-radius:20px;font:600 20px Inter,sans-serif;color:#fff;cursor:pointer}
.talking .pp-btns{visibility:hidden}
#pp-sub{width:560px;min-height:160px;font-size:26px;line-height:1.5;color:#efe6d4;text-shadow:0 2px 8px #000;opacity:0;transition:opacity .35s}
#pp-sub b{display:block;font:500 14px Oswald,sans-serif;letter-spacing:4px;color:#e0a24a;margin-bottom:8px}
#pp-skip{position:absolute;right:28px;bottom:24px;min-height:52px;padding:0 22px}
</style>
</head>
<body>
<div id="wrap"><div id="stage">

  <div id="view" class="layer">
    <div id="cam" class="layer">
      <img id="bgA" class="bg" alt="">
      <img id="bgB" class="bg" alt="" style="opacity:0">
      <img id="litImg" class="bg" alt="" style="opacity:0;transition:none">
      <div id="fx" class="layer"></div>
      <div id="fog" class="layer"><div class="hand" style="left:500px;top:230px"></div><div class="hand" style="left:690px;top:260px;transform:rotate(12deg)"></div></div>
    </div>
    <div id="dark" class="layer"></div>
    <div id="black" class="layer"></div>
  </div>
  <div id="grain" class="layer"></div>
  <div id="vig" class="layer"></div>
  <div id="hot" class="layer"></div>

  <div id="hud" class="layer">
    <div id="clock"><b id="clock-t">12:00 AM</b><span id="clock-n">NIGHT 1</span></div>
    <div id="topr">
      <div class="chip" id="salt" style="display:none">ASIN <b id="salt-n">2</b></div>
      <div class="chip"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#e9dfcb" stroke-width="2" aria-hidden="true"><path d="M8 3h8l-1 6H9z"/><rect x="9" y="9" width="6" height="12" rx="1"/></svg><div class="bar"><i id="batt-i"></i></div></div>
      <button id="runBtn" class="pe chip" type="button">WALK</button>
      <button id="pauseBtn" class="pe" type="button" aria-label="Pause">II</button>
    </div>
    <div id="msg"><small>TITA CORA</small><p id="msg-text"></p></div>
    <div id="cap"></div>
    <div id="breathMeter"></div>
    <div id="hint"></div>
    <div id="sub"><b>TITA CORA</b><span id="sub-t"></span></div>
    <div id="phone" class="pe">
      <div class="ph-top"><span id="ph-state">INCOMING CALL</span><span id="ph-time"></span></div>
      <div class="ph-who"><div class="ph-av">C</div><b id="ph-who">Tita Cora</b></div>
      <div class="ph-btns"><button type="button" id="ph-ans" class="ph-g">Answer</button><button type="button" id="ph-dec" class="ph-r">Decline</button></div>
    </div>
  </div>
  <div id="flash" class="layer"></div>
  <div id="scare"><img id="scare-img" alt=""></div>

  <!-- screens -->
  <div id="scr-load" class="scr"><div class="center">
    <h1 class="logo">ALAS-SAIS</h1>
    <div id="loadBar"><i id="load-i"></i></div>
    <p class="sub" id="load-msg">Loading</p>
    <button class="cta red" id="load-go" type="button" style="visibility:hidden">▶ PLAY</button>
    <p class="note" data-t="headphones"></p>
  </div></div>

 narinig kang humihinga sa likod nito, isara mo, at huwag mong bibitawan hangga't hindi siya umaalis.", "en": "That bedroom door never stays shut by itself. If you hear breathing behind it, close it, and don't let go until she leaves."}, {"fil": "Kapag nakapasok siya, magtago ka sa ilalim ng kama. At habang nasa kwarto siya, huwag kang hihinga.", "en": "If she gets in, hide under the bed. And as long as she's in the room, don't breathe."}, {"fil": "Sumilip ka sa kurtina paminsan-minsan. Kapag nakita mo siyang papalapit, isara mo at hawakan hanggang lumipad siya palayo.", "en": "Look behind the curtain every now and then. If you see her coming, close it and hold it until she flies away."}, {"fil": "At kapag may kaluskos sa aparador, ilawan mo agad. Ayaw nila sa liwanag.", "en": "And if something rustles in the aparador, shine a light on it right away. They hate the light."}, {"fil": "Pagsapit ng alas-sais, tutunog ang kampana ng simbahan. Saka ka lang ligtas.", "en": "At six, the church bell will ring. Only then are you safe."}, {"fil": "Sige na, anak. Matulog ka na. Teka, sino 'yang kasama mo diyan? Bakit may naririnig akong humihinga sa tabi mo?", "en": "Go on, anak. Get some sleep. Wait, who's there with you? Why do I hear someone breathing right next to you?"}]};

  // ------------------------------------------------------------ prologue: Tita Cora's call before the chapter starts (outside the game)
  var pp = null;
  function prologue(key, done) {
    stopMenu(); stopAll();
    var lines = (typeof PROLOGUE !== 'undefined') && PROLOGUE[key];
    if (!lines) { done(); return; }
    initAudio().then(function () {
      pp = { key: key, lines: lines, i: -1, done: done, t: 0, wait: 0, speaking: false };
      $('pp-bg').src = 'assets/img/' + (key === 'c1' ? 'c1_hub' : 'hallway_empty') + '.jpg';
      $('pp-phone').className = 'pp-phone ring'; $('pp-state').textContent = T('ph_calling'); $('pp-time').textContent = '';
      $('pp-sub').style.opacity = 0; $('pp-sub').innerHTML = '';
      show('scr-phone');
      pp.ring = play('ringtone', { loop: true, vol: 0.3 });
      pp.room = play('amb_house', { bus: 'amb', loop: true, vol: 0.35 });
      var last = performance.now();
      (function tick(now) {
        if (!pp) return; pp.raf = requestAnimationFrame(tick);
        var dt = Math.min(0.1, (now - last) / 1000); last = now;
        if (!pp.talking) return;
        pp.t += dt; var s = Math.floor(pp.t); $('pp-time').textContent = '0' + Math.floor(s / 60) + ':' + (s % 60 < 10 ? '0' : '') + (s % 60);
        if (pp.speaking) return;
        pp.wait -= dt; if (pp.wait > 0) return;
        pp.i++;
        if (pp.i >= pp.lines.length) { ppEnd(false); return; }
        var ln = pp.lines[pp.i], txt = save.set.lang === 'fil' ? ln.fil : ln.en, id = 'v_pro_' + pp.key + '_' + pad2(pp.i);
        $('pp-sub').innerHTML = '<b>TITA CORA</b>'; $('pp-sub').appendChild(document.createTextNode(txt)); $('pp-sub').style.opacity = 1;
        if (BUF[id]) { pp.speaking = true; var me = pp; pp.voice = play(id, { bus: 'voice', vol: 1.35 }); if (pp.voice) pp.voice.src.onended = function () { if (pp === me) { me.speaking = false; me.wait = 0.55; } }; else { pp.speaking = false; pp.wait = 1.2 + txt.length * 0.06; } }
        else pp.wait = 1.2 + txt.length * 0.062;
      })(last);
    });
  }
  function ppAnswer() {
    if (!pp || pp.talking) return;
    stop(pp.ring, 0.05); play('phone_pickup', { vol: 0.7 });
    pp.talking = true; pp.wait = 0.8; pp.static = play('line_static', { loop: true, vol: 0.12 });
    $('pp-phone').className = 'pp-phone talking'; $('pp-state').textContent = T('ph_live');
  }
  function ppEnd(skipped) {
    if (!pp) return; var p_ = pp; pp = null;
    cancelAnimationFrame(p_.raf); stop(p_.ring, 0.05); stop(p_.static, 0.2); stop(p_.voice, 0.1); stop(p_.room, 0.5);
    if (!skipped) { play('static_swell', { vol: 0.5 }); play('phone_hangup', { vol: 0.6, delay: 0.6 }); $('pp-state').textContent = T('ph_ended'); }
    setTimeout(function () { $('pp-sub').style.opacity = 0; p_.done(); }, skipped ? 50 : 1800);
  }

  // ------------------------------------------------------------ pause
  function pause(on) {
    if (!game) return;
    paused = on;
    if (on) { if (AC) AC.suspend(); releaseHolds(); show('scr-pause'); }
    else { show(null); lastT = performance.now(); if (AC) AC.resume(); }
  }
  document.addEventListener('visibilitychange', function () { if (document.hidden && game && !paused) pause(true); });

  // ------------------------------------------------------------ fullscreen
  function goFull() {
    var d = document.documentElement, f = d.requestFullscreen || d.webkitRequestFullscreen;
    try { if (f && !document.fullscreenElement) { var r = f.call(d); if (r && r.then) r.then(function () { try { screen.orientation.lock('landscape').catch(function () {}); } catch (e) {} }).catch(function () {}); } } catch (e) {}
  }

  // ------------------------------------------------------------ wiring
  function on(id, fn) { var el = $(id); if (el) el.addEventListener('click', function (e) { e.preventDefault(); play('flashlight_click', { vol: 0.3, bus: 'sfx' }); fn(e); }); }
  function wire() {
    on('load-go', function () { initAudio().then(function () { goFull(); toMenu(); }); });
    on('m-new', function () { save.pro.c1 = false; startNight(0, 1); });
    on('m-cont', function () { var c = save.cur; if (CH_READY[c.ch]) startNight(c.n - 1, c.ch); else show('scr-nights'); });
    on('m-custom', function () { show('scr-nights'); });
    on('pp-ans', function () { ppAnswer(); });
    on('pp-skip', function () { ppEnd(true); });
    on('m-nights', function () { show('scr-nights'); });
    on('m-settings', function () { settingsFrom = 'scr-menu'; show('scr-settings'); });
    on('m-credits', function () { show('scr-credits'); });
    on('m-quit', function () { stopAll(); try { if (document.fullscreenElement) document.exitFullscreen(); } catch (e) {} show('scr-exit'); });
    on('exit-back', function () { toMenu(); });
    on('n-back', function () { show('scr-menu'); });
    on('c-back', function () { show('scr-menu'); });
    on('s-back', function () { store(); show(settingsFrom); });
    on('intro-go', function () { stopAll(); goFull(); beginNight(); });
    on('pauseBtn', function () { pause(true); });
    on('p-resume', function () { pause(false); });
    on('p-restart', function () { paused = false; if (AC) AC.resume(); startNight(nightIdx, curCh); });
    on('p-settings', function () { settingsFrom = 'scr-pause'; show('scr-settings'); });
    on('p-menu', function () { cleanupScene(); paused = false; if (AC) AC.resume(); stopAll(); game = null; if (raf) cancelAnimationFrame(raf); toMenu(); });
    on('w-next', function () { startNight(Math.min(CH_NIGHTS[curCh] - 1, nightIdx + 1), curCh); });
    on('w-menu', function () { toMenu(); });
    on('o-retry', function () { startNight(nightIdx, curCh); });
    on('o-menu', function () { stopAll(); toMenu(); });
    on('e-menu', function () { toMenu(); });
    on('s-full', function () { if (document.fullscreenElement) { try { document.exitFullscreen(); } catch (e) {} } else goFull(); });
    on('t-red', function () { save.set.reduced = !save.set.reduced; renderSettings(); store(); });
    on('rot-ok', function () { rotateDismissed = true; fit(); });
    document.querySelectorAll('.langbtn').forEach(function (b) { b.addEventListener('click', function () { save.set.lang = b.getAttribute('data-lang'); store(); renderTexts(); if (game) { hotSig = ''; buildHot(); } }); });
    document.querySelectorAll('[data-gfx]').forEach(function (b) { b.addEventListener('click', function () { save.set.gfx = b.getAttribute('data-gfx'); store(); renderSettings(); }); });
    ['master', 'sfx', 'amb', 'music'].forEach(function (k) { $('v-' + k).addEventListener('input', function (e) { save.set.vol[k] = e.target.value / 100; $('vl-' + k).textContent = e.target.value; applyVolumes(); }); $('v-' + k).addEventListener('change', store); });
    // room map
    $('ph-ans').addEventListener('click', function (e) { e.preventDefault(); answerCall(); });
    $('ph-dec').addEventListener('click', function (e) { e.preventDefault(); endCall(); });
    $('runBtn').addEventListener('click', function (e) { e.preventDefault(); act('run'); });
    // keyboard
    var keyRoom = { '1': 'bedroom', '2': 'hall', '3': 'living', '4': 'kitchen', '5': 'curtain' };
    window.addEventListener('keydown', function (e) {
      if (e.repeat) return;
      if (e.key === 'Escape') { if (game) pause(!paused); return; }
      if (!game || paused) return;
      if (call && call.state === 'ring') { if (e.key === 'Enter' || e.key === ' ') answerCall(); return; }
      var k = e.key.toLowerCase();
      if (isC1()) {
        var P = game.p;
        if (e.key === '1') c1Go('door'); if (e.key === '2') c1Go('window'); if (e.key === '3') c1Go('cabinet');
        if (k === 's') { if (P.pos === 'bed') act('unhide'); else c1Go('center'); }
        if (k === 'h') act(P.pos === 'bed' ? 'unhide' : 'hide');
        if (k === 'e' && P.pos === 'window') act('curtain');
        if (k === 'f') { heldKeys.f = true; doHold('light', true); }
        if (k === ' ') { e.preventDefault(); var h1 = P.pos === 'door' ? 'door' : P.pos === 'window' && !game.house.curtain ? 'curtain' : P.pos === 'bed' ? 'breath' : P.pos === 'cabinet' ? 'light' : null; if (h1) doHold(h1, true); heldKeys.space = h1; }
        return;
      }
      if (keyRoom[e.key]) go(keyRoom[e.key]);
      if (k === 'r') act('run'); if (k === 'h') act('hide'); if (k === 'e') primary();
      if (k === 't') act('tv'); if (k === 'l') act('lights'); if (k === 'q') act('salt'); if (k === 'b') act('breaker');
      if (k === 'f') { heldKeys.f = true; doHold('light', true); }
      if (k === ' ') { e.preventDefault(); var hn = holdName(); if (hn) doHold(hn, true); heldKeys.space = hn; }
    });
    window.addEventListener('keyup', function (e) {
      if (!game) return; var k = e.key.toLowerCase();
      if (k === 'f') { heldKeys.f = false; doHold('light', false); }
      if (k === ' ' && heldKeys.space) { doHold(heldKeys.space, false); heldKeys.space = null; }
    });
    // stop all holds if the finger leaves the screen anywhere
    var fingers = 0;
    window.addEventListener('pointerdown', function () { fingers++; }, true);
    var up = function () { fingers = Math.max(0, fingers - 1); if (fingers === 0 && game && !heldKeys.space) { var any = game.p.holdDoor || game.p.holdBreath || game.p.holdCurtain || (game.p.light && !heldKeys.f); if (any) { releaseHolds(); document.querySelectorAll('.btn.down').forEach(function (b) { b.classList.remove('down'); }); } } };
    window.addEventListener('pointerup', up, true); window.addEventListener('pointercancel', up, true);
    window.addEventListener('blur', function () { if (game) ['door', 'breath', 'curtain', 'light'].forEach(function (h) { game.hold(h, false); }); stopBreath(); });
  }
  function primary() { var g = game, r = g.p.room; if (r === 'bedroom') act('door'); else if (r === 'living') act(g.house.tv ? 'tv' : 'lights'); else if (r === 'curtain') act('curtain'); else if (r === 'kitchen') act(g.house.power ? 'hide' : 'breaker'); }
  function holdName() { var g = game, r = g.p.room; if (g.p.hidden === 'bed') return 'breath'; if (r === 'bedroom' && g.house.door) return 'door'; if (r === 'curtain' && !g.house.curtain) return 'curtain'; return null; }

  // ------------------------------------------------------------ boot
  window.addEventListener('DOMContentLoaded', function () {
    fit(); makeGrain(); wire(); renderTexts(); show('scr-load');
    loadAll(function (p) { $('load-i').style.width = Math.round(p * 100) + '%'; }).then(function () {
      $('load-go').style.visibility = 'visible'; $('load-msg').textContent = T('tap_start');
    });
    window.__AS_UI = { get game() { return game; }, get call() { return call; }, get pp() { return pp; }, toMenu: toMenu, save: save, startNight: startNight, beginNight: beginNight, act: act, go: go, hold: doHold, show: show, answer: answerCall, hang: endCall };
  });
})();
</script>
