name: Render scenes
on:
  workflow_dispatch:
    inputs:
      samples: { description: 'Cycles samples', default: '64' }
      only: { description: 'Comma list of job names (empty = all)', default: '' }
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include: [{"name": "c1_hub", "cmd": "bed1.py --view=hub --curtain=closed"}, {"name": "c1_hub_open", "cmd": "bed1.py --view=hub --curtain=open"}, {"name": "c1_hub_kumot", "cmd": "bed1.py --view=hub --curtain=closed --kumot"}, {"name": "c1_hub_lit", "cmd": "bed1.py --view=hub --curtain=closed --lit"}, {"name": "c1_door_open", "cmd": "bed1.py --view=door --door=open"}, {"name": "c1_door_open_lit", "cmd": "bed1.py --view=door --door=open --lit"}, {"name": "c1_door_closed", "cmd": "bed1.py --view=door --door=closed"}, {"name": "c1_win_closed", "cmd": "bed1.py --view=window --curtain=closed"}, {"name": "c1_win_shadow", "cmd": "bed1.py --view=window --curtain=closed --silip=3"}, {"name": "c1_win_open", "cmd": "bed1.py --view=window --curtain=open"}, {"name": "c1_win_s1", "cmd": "bed1.py --view=window --curtain=open --silip=1"}, {"name": "c1_win_s2", "cmd": "bed1.py --view=window --curtain=open --silip=2"}, {"name": "c1_win_s3", "cmd": "bed1.py --view=window --curtain=open --silip=3"}, {"name": "c1_scare_barang", "cmd": "bed1.py --view=scare --barang=4"}, {"name": "hero_barang", "cmd": "bed1.py --view=hero --barang=4"}, {"name": "menu_bg", "cmd": "menu.py"}, {"name": "c1_cab_0", "cmd": "bed1.py --view=cabinet --barang=0"}, {"name": "c1_cab_0_lit", "cmd": "bed1.py --view=cabinet --barang=0 --lit"}, {"name": "c1_cab_1", "cmd": "bed1.py --view=cabinet --barang=1"}, {"name": "c1_cab_1_lit", "cmd": "bed1.py --view=cabinet --barang=1 --lit"}, {"name": "c1_cab_2", "cmd": "bed1.py --view=cabinet --barang=2"}, {"name": "c1_cab_2_lit", "cmd": "bed1.py --view=cabinet --barang=2 --lit"}, {"name": "c1_cab_3", "cmd": "bed1.py --view=cabinet --barang=3"}, {"name": "c1_cab_3_lit", "cmd": "bed1.py --view=cabinet --barang=3 --lit"}, {"name": "c1_cab_4", "cmd": "bed1.py --view=cabinet --barang=4"}, {"name": "c1_cab_4_lit", "cmd": "bed1.py --view=cabinet --barang=4 --lit"}, {"name": "menu_silip", "cmd": "menu.py --layer=silip"}]
    steps:
      - uses: actions/checkout@v4
      - name: Skip if not selected
        id: sel
        run: |
          if [ -n "${{ inputs.only }}" ] && ! echo ",${{ inputs.only }}," | grep -q ",${{ matrix.name }},"; then echo "skip=1" >> $GITHUB_OUTPUT; fi
      - uses: actions/setup-python@v5
        if: steps.sel.outputs.skip != '1'
        with: { python-version: '3.13', cache: 'pip', cache-dependency-path: 'tools/blender/requirements.txt' }
      - if: steps.sel.outputs.skip != '1'
        run: pip install -r tools/blender/requirements.txt
      - if: steps.sel.outputs.skip != '1'
        name: Render ${{ matrix.name }}
        run: |
          set -- ${{ matrix.cmd }}
          script=$1; shift
          mkdir -p out
          python tools/blender/$script -- out/${{ matrix.name }}.png ${{ inputs.samples }} "$@" > out/${{ matrix.name }}.log 2>&1 || (tail -40 out/${{ matrix.name }}.log; exit 1)
          tail -3 out/${{ matrix.name }}.log
      - if: steps.sel.outputs.skip != '1'
        uses: actions/upload-artifact@v4
        with: { name: '${{ matrix.name }}', path: 'out/${{ matrix.name }}*', retention-days: 7 }
