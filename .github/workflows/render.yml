name: Render scenes
on:
  workflow_dispatch:
    inputs:
      samples: { description: 'Cycles samples', default: '64' }
      only: { description: 'Comma list of job names (empty = all)', default: '' }
permissions:
  contents: write
  actions: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include: [{"name": "c1_hub", "cmd": "bed1.py --view=hub --curtain=closed"}, {"name": "c1_hub_open", "cmd": "bed1.py --view=hub --curtain=open"}, {"name": "c1_hub_kumot", "cmd": "bed1.py --view=hub --curtain=closed --kumot"}, {"name": "c1_hub_lit", "cmd": "bed1.py --view=hub --curtain=closed --lit"}, {"name": "c1_door_open", "cmd": "bed1.py --view=door --door=open"}, {"name": "c1_door_open_lit", "cmd": "bed1.py --view=door --door=open --lit"}, {"name": "c1_door_closed", "cmd": "bed1.py --view=door --door=closed"}, {"name": "c1_win_closed", "cmd": "bed1.py --view=window --curtain=closed"}, {"name": "c1_win_shadow", "cmd": "bed1.py --view=window --curtain=closed --silip=3"}, {"name": "c1_win_open", "cmd": "bed1.py --view=window --curtain=open"}, {"name": "c1_win_s1", "cmd": "bed1.py --view=window --curtain=open --silip=1"}, {"name": "c1_win_s2", "cmd": "bed1.py --view=window --curtain=open --silip=2"}, {"name": "c1_win_s3", "cmd": "bed1.py --view=window --curtain=open --silip=3"}, {"name": "c1_scare_barang", "cmd": "bed1.py --view=scare --barang=4"}, {"name": "hero_barang", "cmd": "bed1.py --view=hero --barang=4"}, {"name": "c1_cab_0", "cmd": "bed1.py --view=cabinet --barang=0"}, {"name": "c1_cab_0_lit", "cmd": "bed1.py --view=cabinet --barang=0 --lit"}, {"name": "c1_cab_1", "cmd": "bed1.py --view=cabinet --barang=1"}, {"name": "c1_cab_1_lit", "cmd": "bed1.py --view=cabinet --barang=1 --lit"}, {"name": "c1_cab_2", "cmd": "bed1.py --view=cabinet --barang=2"}, {"name": "c1_cab_2_lit", "cmd": "bed1.py --view=cabinet --barang=2 --lit"}, {"name": "c1_cab_3", "cmd": "bed1.py --view=cabinet --barang=3"}, {"name": "c1_cab_3_lit", "cmd": "bed1.py --view=cabinet --barang=3 --lit"}, {"name": "c1_cab_4", "cmd": "bed1.py --view=cabinet --barang=4"}, {"name": "c1_cab_4_lit", "cmd": "bed1.py --view=cabinet --barang=4 --lit"}, {"name": "menu_hall_off", "cmd": "hallway.py", "off": "1"}, {"name": "menu_kitchen_off", "cmd": "kitchen.py", "off": "1"}, {"name": "menu_bed_off", "cmd": "bed1.py --view=hub --curtain=closed", "off": "1"}, {"name": "menu_bed_off_lit", "cmd": "bed1.py --view=hub --curtain=closed", "off": "1", "flash": "1"}, {"name": "menu_hall_off_lit", "cmd": "hallway.py", "off": "1", "flash": "1"}, {"name": "menu_living_off_lit", "cmd": "living.py --tvoff", "off": "1", "flash": "1"}, {"name": "menu_morning", "cmd": "bed1.py --view=hub --curtain=open --morning"}, {"name": "c1_under", "cmd": "bed1.py --view=under"}, {"name": "c1_under_kumot", "cmd": "bed1.py --view=under --kumot"}, {"name": "c1_door_ajar", "cmd": "bed1.py --view=door --door=ajar"}, {"name": "c1_peek_0", "cmd": "bed1.py --view=door --peek=0"}, {"name": "c1_peek_1", "cmd": "bed1.py --view=door --peek=1"}, {"name": "c1_peek_2", "cmd": "bed1.py --view=door --peek=2"}, {"name": "c1_peek_3", "cmd": "bed1.py --view=door --peek=3"}, {"name": "door_ajar_salalit", "cmd": "bed1.py --view=door --door=ajar --sala=lights --hall=lit"}, {"name": "door_ajar_salatv", "cmd": "bed1.py --view=door --door=ajar --sala=tv --hall=lit"}, {"name": "c1_door_sw80", "cmd": "bed1.py --view=door --door=sw80"}, {"name": "c1_door_sw62", "cmd": "bed1.py --view=door --door=sw62"}, {"name": "c1_door_sw46", "cmd": "bed1.py --view=door --door=sw46"}, {"name": "c1_door_sw32", "cmd": "bed1.py --view=door --door=sw32"}, {"name": "c1_door_sw18", "cmd": "bed1.py --view=door --door=sw18"}, {"name": "hallway_salatv", "cmd": "hallway.py --salatv"}, {"name": "c1_door_k1", "cmd": "bed1.py --view=door --door=ajar --kpos=1"}, {"name": "c1_door_k2", "cmd": "bed1.py --view=door --door=ajar --kpos=2"}, {"name": "c1_door_k3", "cmd": "bed1.py --view=door --door=ajar --kpos=3"}, {"name": "c1_win_shadow2", "cmd": "bed1.py --view=window --curtain=closed --silip=2"}, {"name": "hubx_k3", "cmd": "bed1.py --view=hub --curtain=closed --kpos=3"}, {"name": "hubx_s2c", "cmd": "bed1.py --view=hub --curtain=closed --silip=2"}, {"name": "hubx_s3c", "cmd": "bed1.py --view=hub --curtain=closed --silip=3"}, {"name": "hubx_s2o", "cmd": "bed1.py --view=hub --curtain=open --silip=2"}, {"name": "hubx_s3o", "cmd": "bed1.py --view=hub --curtain=open --silip=3"}, {"name": "hubx_b2", "cmd": "bed1.py --view=hub --curtain=closed --barang=2"}, {"name": "hubx_b3", "cmd": "bed1.py --view=hub --curtain=closed --barang=3"}, {"name": "hubx_b4", "cmd": "bed1.py --view=hub --curtain=closed --barang=4"}]
    steps:
      - uses: actions/checkout@v4
      - name: Skip if not selected
        id: sel
        run: |
          if [ -n "${{ inputs.only }}" ] && ! echo ",${{ inputs.only }}," | grep -q ",${{ matrix.name }},"; then echo "skip=1" >> $GITHUB_OUTPUT; fi
      - uses: actions/setup-python@v5
        if: steps.sel.outputs.skip != '1'
        with: { python-version: '3.13', cache: 'pip', cache-dependency-path: 'tools/blender/requirements.txt' }
      - if: steps.sel.outputs.skip != '1'
        run: pip install -r tools/blender/requirements.txt
      - if: steps.sel.outputs.skip != '1'
        name: Render ${{ matrix.name }}
        run: |
          export LIGHTS_OFF='${{ matrix.off }}'
          export FLASHLIGHT='${{ matrix.flash }}'
          set -- ${{ matrix.cmd }}
          script=$1; shift
          mkdir -p out
          python tools/blender/$script -- out/${{ matrix.name }}.png ${{ inputs.samples }} "$@" > out/${{ matrix.name }}.log 2>&1 || (tail -40 out/${{ matrix.name }}.log; exit 1)
          tail -3 out/${{ matrix.name }}.log
      - if: steps.sel.outputs.skip != '1'
        uses: actions/upload-artifact@v4
        with: { name: '${{ matrix.name }}', path: 'out/${{ matrix.name }}*', retention-days: 7 }
  collect:
    needs: render
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: actions/download-artifact@v4
        with: { path: dl }
      - name: Push PNGs to the renders branch
        run: |
          git config user.name alas-sais-bot; git config user.email actions@users.noreply.github.com
          mkdir -p /tmp/raw; find dl -name '*.png' -exec cp {} /tmp/raw/ \; ; find dl -name '*.json' -exec cp {} /tmp/raw/ \;
          if git ls-remote --exit-code origin renders >/dev/null; then git fetch --depth 1 origin renders; git checkout -B renders FETCH_HEAD; else git checkout --orphan renders; git rm -rf -q .; fi
          mkdir -p raw; cp /tmp/raw/* raw/ 2>/dev/null || true; git add raw
          git commit -m "renders from run ${{ github.run_id }} [skip ci]" || echo nothing
          for i in 1 2 3; do git push origin renders && break; git fetch --depth 1 origin renders && git rebase FETCH_HEAD || true; sleep 5; done
