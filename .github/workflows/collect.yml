name: Collect renders
on:
  workflow_dispatch:
    inputs:
      run_id: { description: 'Render run id', required: true }
permissions:
  contents: write
  actions: read
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: actions/download-artifact@v4
        with: { run-id: '${{ inputs.run_id }}', github-token: '${{ github.token }}', path: dl }
      - name: Push PNGs to the renders branch
        run: |
          git config user.name alas-sais-bot; git config user.email actions@users.noreply.github.com
          mkdir -p /tmp/raw; find dl -name '*.png' -exec cp {} /tmp/raw/ \; ; find dl -name '*.json' -exec cp {} /tmp/raw/ \;
          if git ls-remote --exit-code origin renders >/dev/null; then git fetch --depth 1 origin renders; git checkout -B renders FETCH_HEAD; else git checkout --orphan renders; git rm -rf -q .; fi
          mkdir -p raw; cp /tmp/raw/* raw/; git add raw
          git commit -m "renders from run ${{ inputs.run_id }} [skip ci]" || echo nothing
          git push origin renders
