name: Build voice lines
on:
  push:
    branches: [main]
    paths: ['tools/voice/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - run: pip install edge-tts
      - run: python tools/voice/make_voice.py
      - name: Commit voice files
        run: |
          git config user.name "alas-sais-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/voice
          git commit -m "Generate Tita Cora voice lines [skip ci]" || echo "nothing to commit"
          git push
